# NVIDIA GPU for the video worker (Whisper transcription), fork addition.
# Needs BACKEND_CPU_ONLY=false and a CDI spec for the GPU
# (`nvidia-ctk cdi generate`). Enable it with
#   COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml
# in .env, then `docker compose up -d worker`.
services:
  worker:
    devices:
      - nvidia.com/gpu=all
    # SELinux hosts deny container_t the /dev/nvidia* devices unless the
    # container_use_devices boolean is on. spc_t may use them; level s0 keeps
    # the files the worker writes (clips are made in /tmp, then moved) shared
    # with the backend. label=disable would label them for the worker only and
    # the backend could not serve them. Drop both lines if you
    # `setsebool -P container_use_devices=1` instead.
    security_opt:
      - label=type:spc_t
      - label=level:s0
